# Spark settings loaded by every SparkSession in the lab (mounted into $SPARK_HOME/conf).
# This is what a Databricks cluster's "Spark config" box would hold.

# Turn on Iceberg's SQL extensions: MERGE INTO, ALTER TABLE ... ADD PARTITION FIELD,
# CALL system.* procedures (compaction, snapshot expiry, ...).
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# A catalog named "lake" = the Iceberg REST catalog service. Like Unity Catalog, it tracks
# which tables exist and where each table's current metadata file is.
spark.sql.catalog.lake                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                rest
spark.sql.catalog.lake.uri                 http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse           s3://warehouse/

# How Iceberg reads/writes files: its own S3 client, pointed at RustFS instead of AWS.
# path-style = http://rustfs:9000/warehouse/... (local S3 servers need this).
spark.sql.catalog.lake.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint         http://rustfs:9000
spark.sql.catalog.lake.s3.path-style-access true

# Unqualified names (bronze.trips) resolve to the lake catalog.
spark.sql.defaultCatalog                   lake

# Laptop-sized defaults: 200 shuffle partitions is tuned for clusters, not one Mac.
spark.sql.shuffle.partitions               8
spark.driver.memory                        2g
spark.ui.showConsoleProgress               false
